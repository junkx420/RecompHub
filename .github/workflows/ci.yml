name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly catalog check: upstream projects may rename their assets.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build NSIS installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: RecompHub-windows-x64-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  verify-catalog:
    name: Verify catalog against GitHub releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check asset patterns
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          cargo run -q -p recomphub-core --bin verify-catalog catalog/catalog.json | tee -a "$GITHUB_STEP_SUMMARY"
